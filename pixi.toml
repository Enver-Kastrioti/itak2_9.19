[workspace]
name = "itak"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.13"
openjdk = ">=11"
hmmer = ">=3.3,<4"
perl = "*"
pip = "*"

[pypi-dependencies]
biopython = ">=1.83"
pandas = ">=1.5"
numpy = ">=1.23"
torch = "*"
matplotlib = "*"

[environments]
default = { solve-group = "default" }

[tasks]
configure-runtime = "python tools/configure_interproscan_runtime.py"
runtime-status = "python tools/configure_interproscan_runtime.py --status"
runtime-check = "python tools/configure_interproscan_runtime.py --check"
itak = "./itak"
check-deps = "./itak --check-deps"
smoke-test = "./smoke_test.sh"
checkpoint-quick = "./checkpoint_test.sh --suite quick"
